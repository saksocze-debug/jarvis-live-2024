databases:
  - name: jarvis-db
    databaseName: jarvis
    plan: free
    region: frankfurt

services:
  - type: web
    name: jarvis-ultra
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npx next build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.0-flash-live-001
      - key: GEMINI_EMBED_MODEL
        value: text-embedding-004
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
